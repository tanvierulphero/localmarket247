version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: machinery_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_USER=${DB_USER:-erp_user}
      - DB_PASSWORD=${DB_PASSWORD:-YOUR_SECURE_ERP_PASSWORD_CHANGE_ME}
      - DB_NAME=${DB_NAME:-machinery_erp}
    depends_on:
      - db
    restart: always

  db:
    image: mysql:8.0
    container_name: machinery_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-YOUR_SECURE_ROOT_PASSWORD_CHANGE_ME}
      - MYSQL_DATABASE=${DB_NAME:-machinery_erp}
      - MYSQL_USER=${DB_USER:-erp_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-YOUR_SECURE_ERP_PASSWORD_CHANGE_ME}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2_seed.sql
    restart: always

volumes:
  db_data:
