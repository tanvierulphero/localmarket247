<svg viewBox="0 0 430 150" fill="#1e3a8a" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;900&amp;display=swap');
      text { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- High-contrast crisp white rounded background ensuring visibility on both dark and light browser themes -->
  <rect width="430" height="150" rx="22" fill="#ffffff"/>
  <rect x="3" y="3" width="424" height="144" rx="19" fill="none" stroke="#1e3a8a" stroke-width="4" stroke-opacity="0.18"/>

  <!-- Top Left Gear Segment -->
  <g>
    <!-- Teeth -->
    <rect x="104" y="7" width="12" height="12" rx="2" transform="rotate(-15, 110, 60)" />
    <rect x="104" y="7" width="12" height="12" rx="2" transform="rotate(-35, 110, 60)" />
    <rect x="104" y="7" width="12" height="12" rx="2" transform="rotate(-55, 110, 60)" />
    <rect x="104" y="7" width="12" height="12" rx="2" transform="rotate(-75, 110, 60)" />
    <rect x="104" y="7" width="12" height="12" rx="2" transform="rotate(-95, 110, 60)" />
    
    <!-- Main curved ring -->
    <path d="M 62,60 A 48,48 0 0,1 110,12" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" />
    <!-- Inner thin accent ring -->
    <path d="M 72,60 A 38,38 0 0,1 110,22" fill="none" stroke="#1e3a8a" stroke-width="3" />
  </g>

  <!-- Brand Text -->
  <g>
    <text 
      x="215" 
      y="75" 
      text-anchor="middle" 
      font-size="44" 
      font-weight="900" 
      letter-spacing="-0.02em" 
      fill="#1e3a8a"
    >
      HITACHI
    </text>
    <text 
      x="215" 
      y="105" 
      text-anchor="middle" 
      font-size="16" 
      font-weight="700" 
      letter-spacing="0.18em" 
      fill="#1e3a8a"
    >
      AIR SOLUTION CENTER
    </text>
  </g>

  <!-- Bottom Right Gear Segment -->
  <g>
    <!-- Teeth -->
    <rect x="314" y="131" width="12" height="12" rx="2" transform="rotate(15, 320, 90)" />
    <rect x="314" y="131" width="12" height="12" rx="2" transform="rotate(35, 320, 90)" />
    <rect x="314" y="131" width="12" height="12" rx="2" transform="rotate(55, 320, 90)" />
    <rect x="314" y="131" width="12" height="12" rx="2" transform="rotate(75, 320, 90)" />
    <rect x="314" y="131" width="12" height="12" rx="2" transform="rotate(95, 320, 90)" />
    
    <!-- Main curved ring -->
    <path d="M 320,138 A 48,48 0 0,0 368,90" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" />
    <!-- Inner thin accent ring -->
    <path d="M 320,128 A 38,38 0 0,0 358,90" fill="none" stroke="#1e3a8a" stroke-width="3" />
  </g>
</svg>
